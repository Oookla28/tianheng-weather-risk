[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tianheng-weather-impact"
version = "0.1.0"
description = "Tianheng AI Weather Impact: urban weather-risk intelligence and uncertainty-aware decision support"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
